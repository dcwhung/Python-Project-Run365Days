name: CI and GitHub Pages

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# The shared "deploy" group holds exactly the runs that can deploy: those on
# refs/heads/develop (a push, or a manual dispatch on that branch). They are never
# cancelled, because a cancelled run reports as "cancelled" rather than "failed", so
# killing one leaves the site on the old build with no alert. GitHub keeps at most one
# run pending per group, so back-to-back merges still finish with the newest commit
# live -- a deploy is superseded by queueing behind the in-flight one instead of
# aborting it, which also keeps two actions/deploy-pages runs off the Pages deployment
# queue at once.
# Every other run is CI-only and gets its own group keyed on github.ref, cancelling its
# own older runs: one group per PR (pull_request runs carry refs/pull/<n>/merge, which
# is why the same ref test excludes them from the deploy group), one for master, one
# per dispatched side branch. Keying on the ref rather than on the event name matters
# now that master also triggers CI: a master push builds nothing and deploys nothing,
# so it must not sit in the deploy group, where it would queue ahead of -- or evict the
# pending slot of -- a real develop deploy.
concurrency:
  group: pages-${{ github.ref == 'refs/heads/develop' && 'deploy' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Pytest
        run: pytest tests -q

      - name: GraphQL schema is in sync with frontend/schema.graphql
        run: run365-schema --check frontend/schema.graphql

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # --omit=dev audits what actually ships to a browser: the eight runtime
      # dependencies in package.json, 16 packages resolved. That is the scope
      # this gate can hold green, so a red here is a real exposure rather than a
      # backlog. (No dependency audit ran in CI before this step -- the Python
      # side's pip-audit has only ever been run by hand, in CUI-0032.)
      #
      # The full tree is NOT clean and this step does not claim otherwise: as of
      # 2026-09-17 `npm audit` (dev included) reports 14 advisories -- 12 high,
      # 2 moderate, 0 critical -- every one of them reached only through
      # devDependencies (@graphql-codegen/* -> lodash, vitest -> @vitest/mocker).
      # Those are pre-existing, are build- and CI-time only, and are tracked
      # separately in CUI-0036; gating on them would park CI red on a backlog
      # nobody could clear in this change. Widen this step to the full tree once
      # that bump lands -- dropping the flag is the point, not a regression.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck (runs codegen first)
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Build (api mode)
        run: npx vite build

      - name: Build (static mode)
        run: npx cross-env VITE_DATA_MODE=static vite build --outDir dist-static

  build:
    name: Build dashboard (static mode)
    needs: [lint-test, frontend]
    # develop is the single deploy source, so only refs/heads/develop builds the site:
    # a push to it, or a manual dispatch on it for a re-deploy of the same commit.
    # master runs lint-test and frontend and stops here, and pull_request runs carry
    # refs/pull/<n>/merge so the same test excludes them.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      # GitHub Pages serves the site under /<repo>/, so Vite and the router need the prefix
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install package
        run: pip install -e "."

      - name: Export static JSON
        run: run365-export --skip-db --static-dir frontend/public/data

      - name: Build React app in static mode
        working-directory: frontend
        run: |
          npm ci
          npm run build:static
          cp dist/index.html dist/404.html   # deep links: Pages serves 404.html, the router takes over

      - name: Enable Pages if needed
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Same gate as build: only refs/heads/develop reaches the github-pages environment,
    # whose deployment-branch rule also allows develop only.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
