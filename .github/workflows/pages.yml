name: CI and GitHub Pages

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push cancels an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Pytest
        run: pytest tests -q

      - name: GraphQL schema is in sync with frontend/schema.graphql
        run: run365-schema --check frontend/schema.graphql

  frontend:
    name: Frontend lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck (runs codegen first)
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Build (api mode)
        run: npx vite build

      - name: Build (static mode)
        run: npx cross-env VITE_DATA_MODE=static vite build --outDir dist-static

  build:
    name: Build dashboard (static mode)
    needs: [lint-test, frontend]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      # GitHub Pages serves the site under /<repo>/, so Vite and the router need the prefix
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install package
        run: pip install -e "."

      - name: Export static JSON
        run: run365-export --skip-db --static-dir frontend/public/data

      - name: Build React app in static mode
        working-directory: frontend
        run: |
          npm ci
          npm run build:static
          cp dist/index.html dist/404.html   # deep links: Pages serves 404.html, the router takes over

      - name: Enable Pages if needed
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
