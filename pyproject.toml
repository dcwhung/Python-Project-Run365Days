[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "run365days"
version = "3.0.0"
description = "Personal running analytics: Garmin activity parsing, weather correlation, weight tracking and a dashboard"
# 3.11, not 3.10. The dependency floors below decide this, not preference:
# `pip install --python-version 3.10` cannot resolve `numpy>=2.4` at all (3.10's
# newest numpy is 2.2.6) and pandas 3.0 likewise ships no 3.10 wheel. A 3.10 claim
# was never reachable -- developers run 3.11 and CI runs 3.12, so nothing in the
# project ever exercised the version it advertised.
requires-python = ">=3.11"
# Every runtime dependency carries a lower bound at the tested release line and
# an upper bound at the next major. The lower bounds matter as much as the caps:
# the numeric results this project asserts differ between pandas 2 and 3, so an
# unbounded "pandas" on a fresh machine can install a version the tests never ran
# against. Caps bound the blast radius of a future major; they are not a lock
# file, and reproducing an exact set still needs one (see docs follow-up).
dependencies = [
    "numpy>=2.4,<3",
    "pandas>=3.0,<4",
    "python-dateutil>=2.9,<3",
    # zoneinfo ships no data. It reads the host database and only then falls back
    # to this package, so hosts without /usr/share/zoneinfo (slim and distroless
    # containers, minimal base images, Windows) need it to resolve any zone.
    # Calendar-versioned pure data with no API, so it takes a floor and no cap:
    # a cap would expire every year and block timezone corrections.
    "tzdata>=2025.1",
    "requests>=2.32,<3",
    "beautifulsoup4>=4.13,<5",
    "lxml>=6.1,<7",
    "sqlalchemy>=2.0,<3",
    "flask>=3.1,<4",
    # Pre-1.0, so a minor may break the schema; the ceiling is a pragmatic one
    # that still admits routine minors rather than a strict semver reading.
    "strawberry-graphql>=0.327,<0.400",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    # A ruff minor can add or change lint rules, which turns a green checkout red
    # without a code change. `ruff check` is a required gate, so this one is
    # capped to patches and moved deliberately.
    "ruff>=0.16,<0.17",
    "pre-commit>=4,<5",
    # Coverage runs are not part of CI, but `pytest --cov` is used often enough
    # that leaving it undeclared means it only works where it happens to be
    # preinstalled -- the same undeclared-dependency defect as the bounds above.
    "pytest-cov>=7,<8",
]

[project.scripts]
run365-activities = "run365days.cli.process_activities:main"
run365-weather = "run365days.cli.collect_weather:main"
run365-export = "run365days.cli.export_data:main"
run365-schema = "run365days.cli.export_schema:main"
run365-ci-docs = "run365days.cli.check_ci_docs:main"

# The package lives in src/ but is imported as `run365days`.
[tool.setuptools]
package-dir = { "run365days" = "src" }
packages = [
    "run365days",
    "run365days.activities",
    "run365days.activities.parsers",
    "run365days.api",
    "run365days.cli",
    "run365days.common",
    "run365days.dashboard",
    "run365days.export",
    "run365days.weather",
    "run365days.weather.collectors",
    "run365days.weight",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# No target-version here. It used to say "py310" beside a requires-python of
# ">=3.10", two copies of one fact, and a fix to either alone leaves the pair
# disagreeing about which syntax is legal. ruff falls back to
# project.requires-python when target-version is absent, so deleting it leaves a
# single owner that cannot drift.
src = ["src", "tests", "api"]
# legacy/ holds reference-only v1 scripts that are deliberately outside the
# quality system: no tests, never imported by src/, not built or deployed by CI.
# .pre-commit-config.yaml already excludes them, but that exclusion only applies
# to the hook. Stating it here is what makes a bare `ruff check .` usable: without
# it the command reports 531 pre-existing errors, all of them in legacy/, so it can
# never be green on any commit and every real finding in src/, tests/ and api/
# hides behind the noise. Excluding the directory in one place lets the tool answer
# "is this repository clean?" instead of only "is this path list clean?".
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "D",   # pydocstyle (Google convention)
    "S",   # flake8-bandit (security)
    # api/graphql.py already carried two `# noqa: BLE001` directives with written
    # justifications, so a previous author expected this rule to be on. It was not,
    # which made those directives dead text. Enabling it adds no new finding --
    # those two sites are the only ones -- and makes their reasoning load-bearing.
    "BLE", # flake8-blind-except
    # Every `# noqa` must suppress something that is actually enabled. Without this
    # a directive keeps looking like a considered decision long after the rule it
    # names is gone, and a reader has no way to tell the live ones from the fossils.
    "RUF100", # unused noqa directive
    # AU-020 counted 20 unannotated functions by hand. Counting by hand is the
    # defect: the number was stale before it was written down. ANN keeps it at zero
    # without anyone tracking it.
    "ANN",  # flake8-annotations
]
ignore = [
    "D105", # magic methods need no docstring
    "D107", # __init__ is documented in the class docstring
]

[tool.ruff.lint.per-file-ignores]
# S101 only, never the whole "S" prefix: `assert` is how a pytest test states its
# expectation, and pytest rewrites the statement to produce the failure message, so
# banning it would ban testing. Every other security rule still applies to tests --
# a hardcoded password or an unsafe deserialisation in a fixture is still a finding.
"tests/*" = [
    "D",     # test names are the documentation
    "S101",  # assert is the idiom (see above)
    # The annotation rules are split here rather than dropped wholesale. Measured
    # on this tree: ANN001 fires 466 times and ANN201 409 times in tests/, and
    # essentially all of it is `def test_x() -> None` plus fixture parameters whose
    # types pytest already fixes (tmp_path, monkeypatch, parametrize arguments).
    # Writing those 875 annotations buys a reader nothing -- pytest itself rejects a
    # test that returns non-None -- while the diff is large enough to hide a real
    # change inside it.
    "ANN001", # fixture and parametrize parameters
    "ANN002", # *args on test doubles
    "ANN003", # **kwargs on test doubles
    "ANN201", # test functions return None by pytest's own contract
    # ANN202 and ANN205 are deliberately NOT ignored. A helper's return type is the
    # one annotation a caller cannot infer by looking at the call, which is the
    # whole reason AU-020 was raised; the 19 helpers in tests/ have it.
]
"src/cli/*" = ["D103"]             # main() is described by the module docstring
"src/api/schema.py" = ["D101", "D102"]  # GraphQL types carry descriptions in the schema
"api/*" = ["D"]

[tool.ruff.lint.flake8-annotations]
# A `**kwargs` that exists only to be forwarded to super() has no narrower honest
# type than Any -- the accepted keywords are the parent's, and restating them here
# would be a copy that goes stale the first time the parent changes. ANN003 still
# applies, so the annotation cannot simply be left off. Return values and ordinary
# arguments are unaffected: ANN401 still rejects Any there.
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["run365days"]

[tool.ruff.format]
quote-style = "double"
# ruff formats Python code blocks embedded in Markdown. Review reports and tickets
# quote fragments on purpose -- deliberately broken code, partial expressions, a
# before/after pair -- and the formatter rewrites them as if they were whole
# programs: one quoted `time=parse_datetime(...)` argument came back as
# `time = (parse_datetime(...),)`, which is a different statement. Evidence must
# survive verbatim, so prose is not the formatter's business.
exclude = ["*.md"]
