[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "run365days"
version = "3.1.1"
description = "Personal running analytics: Garmin activity parsing, weather correlation, weight tracking and a dashboard"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "python-dateutil",
    # zoneinfo ships no data. It reads the host database and only then falls back
    # to this package, so hosts without /usr/share/zoneinfo (slim and distroless
    # containers, minimal base images, Windows) need it to resolve any zone.
    "tzdata",
    "requests",
    "beautifulsoup4",
    "lxml",
    "sqlalchemy>=2.0",
    "flask>=3",
    "strawberry-graphql>=0.250",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    # Coverage is a signal this project quotes rather than an optional extra of
    # its own: the reports under .proj-docs/qa/ and .proj-docs/reviews/ cite a
    # number, and several tickets name one as their verification. Leaving it
    # out made every clone and every worktree install it by hand before it
    # could measure anything (CUI-0032). Vercel never sees it -- requirements.txt
    # and scripts/vercel-build.sh both install a bare ".", so the serverless
    # function gets the core dependencies and no extras.
    "pytest-cov>=5",
    "ruff>=0.5",
    "pre-commit>=3",
]

[project.scripts]
run365-activities = "run365days.cli.process_activities:main"
run365-weather = "run365days.cli.collect_weather:main"
run365-export = "run365days.cli.export_data:main"
run365-schema = "run365days.cli.export_schema:main"

# The package lives in src/ but is imported as `run365days`.
[tool.setuptools]
package-dir = { "run365days" = "src" }
packages = [
    "run365days",
    "run365days.activities",
    "run365days.activities.parsers",
    "run365days.api",
    "run365days.cli",
    "run365days.common",
    "run365days.dashboard",
    "run365days.export",
    "run365days.weather",
    "run365days.weather.collectors",
    "run365days.weight",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# What a bare `pytest --cov` measures, so that it and `pytest --cov=src` are the
# same run. Only the denominator is fixed here, and deliberately nothing else:
# an `omit` would move every coverage number already quoted in .proj-docs/ away
# from the figure it was recorded as, and `branch = true` would move it again.
# No `fail_under` either -- a threshold is one more hardcoded number that drifts
# out of step with the thing it describes (CUI-0024, CUI-0031), and this project
# reads coverage as a signal rather than as a gate.
[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "api"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "D",   # pydocstyle (Google convention)
]
ignore = [
    "D105", # magic methods need no docstring
    "D107", # __init__ is documented in the class docstring
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]                  # test names are the documentation
"src/cli/*" = ["D103"]             # main() is described by the module docstring
"src/api/schema.py" = ["D101", "D102"]  # GraphQL types carry descriptions in the schema
"api/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["run365days"]
# `src` includes api/ (Vercel mandates api/graphql.py), which makes ruff read a bare
# `graphql` import as this repo's own module. Name graphql-core explicitly so the
# import sorts with the other third-party packages.
known-third-party = ["graphql"]

[tool.ruff.format]
quote-style = "double"
