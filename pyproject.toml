[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "run365days"
version = "0.1.0"
description = "Personal running analytics: Garmin activity parsing, weather correlation, weight tracking"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "python-dateutil",
    "pytz",
    "requests",
    "beautifulsoup4",
    "lxml",
    "matplotlib",
    "scikit-learn",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
run365-process  = "scripts.process:main"
run365-weather  = "scripts.collect_weather:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
