"""One run parsed from the Garmin TCX export."""
type Activity {
  id: ID!
  date: String!
  startTime: String!
  dayOfYear: Int!
  distanceKm: Float!
  durationSec: Int!
  paceSecPerKm: Int
  calories: Int
  avgCadence: Float
  avgTempC: Float
  elevationMinM: Float
  elevationMaxM: Float
  ascentM: Float
  hasGps: Boolean!
  numPoints: Int!
  weather: RunWeather
  warnings: [String!]!

  """
  GPS track, evenly downsampled to at most `points` (1-1000) samples. `points: 1` has nothing to space evenly and returns the track's last row alone, not its first. Outside that range the field is refused rather than clamped -- `points: 0` in particular, which reads as `no limit` in every language whose falsy rules invite it, and is the fan-out AU-001 closed. One request may read at most 64 `track` fields, totalling 10000 points. Both are counted across every `track` field in the request; points are charged on `points` as asked for, not on the rows a track turns out to hold. The field limit applies however small `points` is, because each `track` field costs the same query either way. A refusal carries `extensions.code`: `TRACK_FIELD_BUDGET_EXCEEDED` (send fewer `track` fields -- a smaller `points` will not help), `TRACK_POINTS_BUDGET_EXCEEDED` (ask for fewer points), or `ARGUMENT_OUT_OF_RANGE` for a `points` outside the range above, which retrying unchanged never fixes. Branch on the code rather than on the message; the message quotes these limits and so changes whenever they are tuned.
  """
  track(points: Int! = 150): [TrackPoint!]!
}

"""One day of the Hong Kong Observatory daily extract."""
type DailyWeather {
  date: String!
  maxTempC: Float
  avgTempC: Float
  minTempC: Float
  humidityPct: Float
  rainfallMm: Float
  windKmh: Float
  sunrise: String
  sunset: String
}

"""Date (isoformat)"""
scalar Date

type DayDistance {
  date: String!
  distanceKm: Float!
  activityId: ID
}

type Meta {
  year: Int!
  generatedAt: String!
  trackColumns: [String!]!
}

type MonthSummary {
  month: Int!
  runs: Int!
  distanceKm: Float!
  durationSec: Int!
  calories: Int!
  avgPaceSecPerKm: Int
  avgCadence: Float
  bestPaceSecPerKm: Int
  bestPaceActivityId: ID
}

type PersonalBests {
  longest: Activity
  fastest: Activity
  longestTime: Activity
  mostCalories: Activity
  topCadence: Activity
}

type Query {
  """Export metadata."""
  meta: Meta!

  """
  Runs in start order, optionally filtered (dates inclusive). One request may open at most 4000 rows of pages in total, counted across every field in it that opens one. Overrunning it is refused with `extensions.code` `LIST_ROW_BUDGET_EXCEEDED`, which a narrower request can succeed at. The window is `limit` (1-1000) rows from `offset` (0 or more); either side of that range is refused rather than clamped -- with `extensions.code` `ARGUMENT_OUT_OF_RANGE`, which retrying unchanged never fixes -- and the budget above is charged on `limit` as asked for rather than on the rows a page turns out to hold.
  """
  activities(fromDate: Date = null, toDate: Date = null, minKm: Float = null, hasGps: Boolean = null, limit: Int! = 500, offset: Int! = 0): [Activity!]!

  """
  Rows matching the same filters, ignoring `limit` and `offset`. A list shorter than this count was cut off by the page window.
  """
  activitiesCount(fromDate: Date = null, toDate: Date = null, minKm: Float = null, hasGps: Boolean = null): Int!

  """One run by Garmin activity id."""
  activity(id: ID!): Activity

  """
  Daily weigh-ins (dates inclusive). One request may open at most 4000 rows of pages in total, counted across every field in it that opens one. Overrunning it is refused with `extensions.code` `LIST_ROW_BUDGET_EXCEEDED`, which a narrower request can succeed at. The window is `limit` (1-1000) rows from `offset` (0 or more); either side of that range is refused rather than clamped -- with `extensions.code` `ARGUMENT_OUT_OF_RANGE`, which retrying unchanged never fixes -- and the budget above is charged on `limit` as asked for rather than on the rows a page turns out to hold.
  """
  weight(fromDate: Date = null, toDate: Date = null, limit: Int! = 500, offset: Int! = 0): [WeightEntry!]!

  """
  Rows matching the same filters, ignoring `limit` and `offset`. A list shorter than this count was cut off by the page window.
  """
  weightCount(fromDate: Date = null, toDate: Date = null): Int!

  """
  HKO daily weather (dates inclusive). One request may open at most 4000 rows of pages in total, counted across every field in it that opens one. Overrunning it is refused with `extensions.code` `LIST_ROW_BUDGET_EXCEEDED`, which a narrower request can succeed at. The window is `limit` (1-1000) rows from `offset` (0 or more); either side of that range is refused rather than clamped -- with `extensions.code` `ARGUMENT_OUT_OF_RANGE`, which retrying unchanged never fixes -- and the budget above is charged on `limit` as asked for rather than on the rows a page turns out to hold.
  """
  weather(fromDate: Date = null, toDate: Date = null, limit: Int! = 500, offset: Int! = 0): [DailyWeather!]!

  """
  Rows matching the same filters, ignoring `limit` and `offset`. A list shorter than this count was cut off by the page window.
  """
  weatherCount(fromDate: Date = null, toDate: Date = null): Int!

  """
  HKO warnings and signals (dates inclusive). One request may open at most 4000 rows of pages in total, counted across every field in it that opens one. Overrunning it is refused with `extensions.code` `LIST_ROW_BUDGET_EXCEEDED`, which a narrower request can succeed at. The window is `limit` (1-1000) rows from `offset` (0 or more); either side of that range is refused rather than clamped -- with `extensions.code` `ARGUMENT_OUT_OF_RANGE`, which retrying unchanged never fixes -- and the budget above is charged on `limit` as asked for rather than on the rows a page turns out to hold.
  """
  warnings(fromDate: Date = null, toDate: Date = null, limit: Int! = 500, offset: Int! = 0): [WeatherWarning!]!

  """
  Rows matching the same filters, ignoring `limit` and `offset`. A list shorter than this count was cut off by the page window.
  """
  warningsCount(fromDate: Date = null, toDate: Date = null): Int!

  """
  Aggregates for the exported year (or a given year). Reads a whole year of runs, so it spends one default page (500 rows) of the same budget the list fields spend. One request may open at most 4000 rows of pages in total, counted across every field in it that opens one. Overrunning it is refused with `extensions.code` `LIST_ROW_BUDGET_EXCEEDED`, which a narrower request can succeed at.
  """
  year(year: Int = null): YearSummary!
}

"""Hourly weather observation closest to the run's start time."""
type RunWeather {
  description: String
  tempC: Float
  humidityPct: Float
  windKmh: Float
}

type Totals {
  runs: Int!
  days: Int!
  activeDays: Int!
  distanceKm: Float!
  durationSec: Int!
  calories: Int!
  avgPaceSecPerKm: Int
  avgCadence: Float
  avgDistanceKm: Float!
}

"""One stored sample of a run's track."""
type TrackPoint {
  sec: Int!
  lat: Float
  lon: Float
  elevationM: Float
  distanceM: Float
  speedMps: Float
  cadence: Int
  tempC: Float
}

"""Exponentially weighted load: fitness (CTL), fatigue (ATL), form (TSB)."""
type TrainingLoadPoint {
  date: String!
  ctl: Float!
  atl: Float!
  tsb: Float!
}

"""One HKO warning or tropical cyclone signal."""
type WeatherWarning {
  date: String!
  type: String
  signal: String!
  startTime: String
  endTime: String
}

type WeekSummary {
  week: Int!
  weekStart: String!
  runs: Int!
  distanceKm: Float!
  durationSec: Int!
  avgPaceSecPerKm: Int
  longestKm: Float!
  activityIds: [ID!]!
}

type WeightEntry {
  date: String!
  weightLbs: Float!
  weightKg: Float!
  bmi: Float!
}

"""Everything the overview and analytics views need for one year."""
type YearSummary {
  year: Int!
  totals: Totals!
  monthly: [MonthSummary!]!
  weekly: [WeekSummary!]!
  dailyDistance: [DayDistance!]!
  trainingLoad: [TrainingLoadPoint!]!
  personalBests: PersonalBests!
}
